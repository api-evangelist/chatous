aid: chatous
name: chatous
description: Chatous is a consumer messaging application for random, anonymous chat
  with real people from around the world over text and video. It connects strangers
  by shared interests using topic hashtags, letting users make friends and start conversations
  across iOS and Android. Chatous is a mobile-first social product backed by Slow Ventures;
  it publishes a consumer website, privacy policy, and terms of service but does not
  expose a public developer API, SDK, or documented API program at this time.
